name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_relay:
        description: Redeploy the current exact main Relay after Quality passes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (exact head)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify checkout revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and Vue tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser acceptance
        run: pnpm test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ env.EXPECTED_SHA }}
          path: /tmp/onerway-payment-showcase-playwright
          if-no-files-found: ignore
          retention-days: 7

  relay-scope:
    name: Relay deployment scope
    if: >-
      vars.RELAY_DEPLOY_ENABLED == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_relay)
      )
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    env:
      BEFORE_SHA: ${{ github.event.before }}
      EVENT_NAME: ${{ github.event_name }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Detect Relay deployment changes
        id: scope
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$EXPECTED_SHA" -- \
            relay \
            scripts/relay.mjs \
            package.json \
            pnpm-lock.yaml \
            .github/workflows/ci.yml \
            .github/workflows/relay-deploy.yml; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  relay:
    name: Deploy Webhook Relay
    if: needs.relay-scope.outputs.deploy == 'true'
    needs:
      - quality
      - relay-scope
    uses: ./.github/workflows/relay-deploy.yml
    with:
      expected_sha: ${{ github.sha }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
