  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

: U+2000-2001, U+2004-2008, U+200A, U+23B8-23BD, U+2500-259F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"cca16706-ca4c-4562-baa1-d95c45ffc066\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7893f607-d7bd-4c60-ba1f-21637b3a67da\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8269497a-9c1a-477a-a8fb-637c48675d6b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/*\n * Color primitives — the resolved ramps that Nuxt UI's semantic roles map to.\n * Source of truth: abel-2333-org/geist-nuxt (packages/core app.config.ts role mapping + main.css ramps)\n * on top of nuxt/ui's token model.\n *\n * Role → palette mapping (geist-nuxt app.config.ts alias → EXACT Geist scale):\n *   primary = custom violet ramp   neutral = true-gray (Tailwind neutral swatch only)\n *   secondary = Geist teal   success = Geist green   info = Geist blue\n *   warning = Geist amber   error = Geist red\n *\n * The functional ramps are the EXACT Geist accent scales (geist-colors), NOT\n * Tailwind defaults — verbatim from main.css. Geist encodes intent by step\n * (700 = solid fill), so Geist-700 is mapped onto Tailwind-500 (Nuxt UI's light\n * default), dark uses 400. Deep 800–950 steps are proportional dark-fills of\n * Geist-1000 (rarely consumed by semantic tokens); copied verbatim, not\n * normalized — some are non-monotonic (e.g. info 600/700), matching source.\n *\n * Components never read these directly — they read the semantic --ui-* tokens\n * (semantic.css), which alias into the -500/-400 shades of these ramps.\n */\n:root {\n  /* Type — Geist Sans / Geist Mono (geist-nuxt @theme). @nuxt/fonts self-hosts\n     these from Google Fonts in the runtime; here fonts.css loads the same. */\n  --font-sans: \"Geist\", ui-sans-serif, system-ui, -apple-system, \"PingFang SC\", \"Microsoft YaHei\", \"Noto Sans SC\", sans-serif;\n  --font-mono: \"Geist Mono\", ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Monaco, Consolas, \"Liberation Mono\", monospace;\n\n  /* primary — custom violet ramp (geist-nuxt main.css, verbatim). The brand\n     accent; --ui-primary resolves to 500 (light) / 400 (dark). */\n  --ui-color-primary-50: #f6f0ff;\n  --ui-color-primary-100: #eee3ff;\n  --ui-color-primary-200: #dfc7ff;\n  --ui-color-primary-300: #c8a0ff;\n  --ui-color-primary-400: #a96eff;\n  --ui-color-primary-500: #7a3ce2;\n  --ui-color-primary-600: #6b30cf;\n  --ui-color-primary-700: #5925b1;\n  --ui-color-primary-800: #4a2290;\n  --ui-color-primary-900: #3d1d74;\n  --ui-color-primary-950: #261047;\n\n  /* secondary — EXACT Geist teal (geist-colors), verbatim from main.css */\n  --ui-color-secondary-50: #eefcf9;\n  --ui-color-secondary-100: #e5faf6;\n  --ui-color-secondary-200: #d4f7f0;\n  --ui-color-secondary-300: #bef4eb;\n  --ui-color-secondary-400: #45dec5;\n  --ui-color-secondary-500: #12a594;\n  --ui-color-secondary-600: #0d8c7d;\n  --ui-color-secondary-700: #067a6e;\n  --ui-color-secondary-800: #073c34;\n  --ui-color-secondary-900: #052924;\n  --ui-color-secondary-950: #04201c;\n\n  /* success — EXACT Geist green (geist-colors), verbatim from main.css */\n  --ui-color-success-50: #effbef;\n  --ui-color-success-100: #ebfaeb;\n  --ui-color-success-200: #daf6da;\n  --ui-color-success-300: #c6f1c7;\n  --ui-color-success-400: #6cda75;\n  --ui-color-success-500: #45a557;\n  --ui-color-success-600: #398e4a;\n  --ui-color-success-700: #297a3a;\n  --ui-color-success-800: #1b311e;\n  --ui-color-success-900: #142416;\n  --ui-color-success-950: #0e1a10;\n\n  /* info — EXACT Geist blue (geist-colors, signature #0072f5), verbatim */\n  --ui-color-info-50: #f0f7ff;\n  --ui-color-info-100: #ebf5ff;\n  --ui-color-info-200: #e0f0ff;\n  --ui-color-info-300: #cce6ff;\n  --ui-color-info-400: #52aeff;\n  --ui-color-info-500: #0072f5;\n  --ui-color-info-600: #0062d1;\n  --ui-color-info-700: #0068d6;\n  --ui-color-info-800: #00254d;\n  --ui-color-info-900: #001b38;\n  --ui-color-info-950: #001429;\n\n  /* warning — custom amber scale (now upstream in geist-nuxt main.css too;\n     replaces Geist's amber, all other functional ramps remain exact Geist).\n     --ui-warning = 500 (light) / 400 (dark). */\n  --ui-color-warning-50: #FFF8E1;\n  --ui-color-warning-100: #FEF0C7;\n  --ui-color-warning-200: #FDE29A;\n  --ui-color-warning-300: #FBD16B;\n  --ui-color-warning-400: #F4B740;\n  --ui-color-warning-500: #E99B18;\n  --ui-color-warning-600: #C97807;\n  --ui-color-warning-700: #9D5705;\n  --ui-color-warning-800: #7B4207;\n  --ui-color-warning-900: #64350B;\n  --ui-color-warning-950: #3A1B03;\n\n  /* error — EXACT Geist red (geist-colors), verbatim from main.css */\n  --ui-color-error-50: #fff0f0;\n  --ui-color-error-100: #ffebeb;\n  --ui-color-error-200: #ffe5e5;\n  --ui-color-error-300: #fdd8d8;\n  --ui-color-error-400: #f87275;\n  --ui-color-error-500: #e5484d;\n  --ui-color-error-600: #da2f35;\n  --ui-color-error-700: #cb2a2f;\n  --ui-color-error-800: #391417;\n  --ui-color-error-900: #2a0e11;\n  --ui-color-error-950: #1e0a0c;\n\n  /* neutral — Tailwind neutral (nuxt/ui default kept by geist-nuxt). The\n     VISIBLE surface/text/border grays are the exact Geist scale, applied as\n     semantic overrides in semantic.css; this ramp backs `color=\"neutral\"`. */\n  --ui-color-neutral-50: #fafafa;\n  --ui-color-neutral-100: #f5f5f5;\n  --ui-color-neutral-200: #e5e5e5;\n  --ui-color-neutral-300: #d4d4d4;\n  --ui-color-neutral-400: #a3a3a3;\n  --ui-color-neutral-500: #737373;\n  --ui-color-neutral-600: #525252;\n  --ui-color-neutral-700: #404040;\n  --ui-color-neutral-800: #262626;\n  --ui-color-neutral-900: #171717;\n  --ui-color-neutral-950: #0a0a0a;\n}\n<\u002Fstyle>\n<style>/*\n * Semantic layer — the public token contract components consume.\n * Source of truth: abel-2333-org/geist-nuxt (packages/core main.css + Geist --ds-gray) + nuxt/ui.\n *\n * Geist visual language: monochrome, high-contrast, small radius, calm\n * elevation. Nuxt UI derives every runtime token (--ui-text-*, --ui-bg-*,\n * --ui-border-*, --ui-primary …) from a neutral ramp, but Geist ships\n * independent light/dark values at each step — so we override the semantic\n * --ui-* tokens per mode directly (values = Geist's published --ds-gray).\n */\n\n/* ── Radius — Geist 3-tier, derived from a single --ui-radius (6px base) ──── */\n/* Nuxt UI scales xs .5× / sm 1× / md 1.5× / lg 2× / xl 3×. Base 6px lands the\n   control tier (sm = 6) and panel tier (lg = 12) on Geist exactly; the largest\n   tier is pinned to 16 (3× would be 18). Mapping: control/input/badge → sm;\n   card/panel → lg; modal/overlay → xl. */\n:root {\n  --ui-radius: 0.375rem;   /* 6px  — Geist material-base */\n  --radius-xs: 0.1875rem;  /* 3px  */\n  --radius-sm: 0.375rem;   /* 6px  — control / input / badge */\n  --radius-md: 0.5625rem;  /* 9px  */\n  --radius-lg: 0.75rem;    /* 12px — card / panel */\n  --radius-xl: 16px;       /* pinned (3× would be 18px) — modal / overlay */\n\n  --ui-container: 1200px;  /* Geist content column width */\n\n  /* Type scale addition — \"Copy 13 Mono\" (13px inline code). Upstream promotes\n     this to a semantic token (--text-code) so 13px inline code is a single\n     source of truth; InlineCode consumes it. */\n  --text-code: 0.8125rem;\n\n  /* Elevation — Geist subtle 3-tier. Cards/tooltips use --shadow-xs (per-mode,\n     below); popovers/menus use --shadow-lg; modals/dialogs use --shadow-xl.\n     Popover & modal shadows are identical in light and dark. */\n  --shadow-lg: 0 1px 1px rgba(0, 0, 0, 0.02), 0 4px 8px -4px rgba(0, 0, 0, 0.04), 0 16px 24px -8px rgba(0, 0, 0, 0.06);\n  --shadow-xl: 0 1px 1px rgba(0, 0, 0, 0.02), 0 8px 16px -4px rgba(0, 0, 0, 0.04), 0 24px 32px -8px rgba(0, 0, 0, 0.06);\n\n  /* Motion — Geist signature spring-like ease. Durations: 150ms state, 200ms\n     popover/tooltip, 300ms overlay. Honor prefers-reduced-motion (base.css). */\n  --ease-out: cubic-bezier(0.175, 0.885, 0.32, 1.1); /* @kind other */\n\n  /* Breakpoints — exact Geist values (informational; the runtime remaps\n     Tailwind's --breakpoint-* so every sm:/md:/lg: utility follows Geist). */\n  --breakpoint-sm: 401px;\n  --breakpoint-md: 601px;\n  --breakpoint-lg: 961px;\n  --breakpoint-xl: 1200px;\n  --breakpoint-2xl: 1400px;\n}\n\n/* ── Light theme runtime tokens — exact Geist LIGHT --ds-gray ─────────────── */\n:root,\n.light {\n  --ui-primary: var(--ui-color-primary-500);\n  --ui-secondary: var(--ui-color-secondary-500);\n  --ui-success: var(--ui-color-success-500);\n  --ui-info: var(--ui-color-info-500);\n  --ui-warning: var(--ui-color-warning-500);\n  --ui-error: var(--ui-color-error-500);\n\n  --ui-bg: #ffffff;              /* Geist Background 1 */\n  --ui-bg-muted: #fafafa;        /* Geist Background 2 */\n  --ui-bg-elevated: #f2f2f2;     /* Geist gray-100 */\n  --ui-bg-accented: #ebebeb;     /* Geist gray-200 */\n  --ui-bg-inverted: #171717;     /* Geist gray-1000 */\n\n  --ui-border-muted: #ebebeb;    /* Geist gray-200 */\n  --ui-border: #ebebeb;          /* default border */\n  --ui-border-accented: #c9c9c9; /* Geist gray-500 (hover border) */\n  --ui-border-inverted: #171717;\n\n  --ui-text-dimmed: #a8a8a8; 3e2542a7-d1b4-4b93-bf3c-bd33925c3e87\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6fe88312-870f-477d-a7ae-92f98ec474aa\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* symbols2 */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f73a3e72-e3e0-4418-b7e8-d21a5d1c1bb7\") format('woff2');\n  unicode-range: U+2000-2001, U+2004-2008, U+200A, U+23B8-23BD, U+2500-259F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"cca16706-ca4c-4562-baa1-d95c45ffc066\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7893f607-d7bd-4c60-ba1f-21637b3a67da\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8269497a-9c1a-477a-a8fb-637c48675d6b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/*\n * Color primitives — the resolved ramps that Nuxt UI's semantic roles map to.\n * Source of truth: abel-2333-org/geist-nuxt (packages/core app.config.ts role mapping + main.css ramps)\n * on top of nuxt/ui's token model.\n *\n * Role → palette mapping (geist-nuxt app.config.ts alias → EXACT Geist scale):\n *   primary = custom violet ramp   neutral = true-gray (Tailwind neutral swatch only)\n *   secondary = Geist teal   success = Geist green   info = Geist blue\n *   warning = Geist amber   error = Geist red\n *\n * The functional ramps are the EXACT Geist accent scales (geist-colors), NOT\n * Tailwind defaults — verbatim from main.css. Geist encodes intent by step\n * (700 = solid fill), so Geist-700 is mapped onto Tailwind-500 (Nuxt UI's light\n * default), dark uses 400. Deep 800–950 steps are proportional dark-fills of\n * Geist-1000 (rarely consumed by semantic tokens); copied verbatim, not\n * normalized — some are non-monotonic (e.g. info 600/700), matching source.\n *\n * Components never read these directly — they read the semantic --ui-* tokens\n * (semantic.css), which alias into the -500/-400 shades of these ramps.\n */\n:root {\n  /* Type — Geist Sans / Geist Mono (geist-nuxt @theme). @nuxt/fonts self-hosts\n     these from Google Fonts in the runtime; here fonts.css loads the same. */\n  --font-sans: \"Geist\", ui-sans-serif, system-ui, -apple-system, \"PingFang SC\", \"Microsoft YaHei\", \"Noto Sans SC\", sans-serif;\n  --font-mono: \"Geist Mono\", ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Monaco, Consolas, \"Liberation Mono\", monospace;\n\n  /* primary — custom violet ramp (geist-nuxt main.css, verbatim). The brand\n     accent; --ui-primary resolves to 500 (light) / 400 (dark). */\n  --ui-color-primary-50: #f6f0ff;\n  --ui-color-primary-100: #eee3ff;\n  --ui-color-primary-200: #dfc7ff;\n  --ui-color-primary-300: #c8a0ff;\n  --ui-color-primary-400: #a96eff;\n  --ui-color-primary-500: #7a3ce2;\n  --ui-color-primary-600: #6b30cf;\n  --ui-color-primary-700: #5925b1;\n  --ui-color-primary-800: #4a2290;\n  --ui-color-primary-900: #3d1d74;\n  --ui-color-primary-950: #261047;\n\n  /* secondary — EXACT Geist teal (geist-colors), verbatim from main.css */\n  --ui-color-secondary-50: #eefcf9;\n  --ui-color-secondary-100: #e5faf6;\n  --ui-color-secondary-200: #d4f7f0;\n  --ui-color-secondary-300: #bef4eb;\n  --ui-color-secondary-400: #45dec5;\n  --ui-color-secondary-500: #12a594;\n  --ui-color-secondary-600: #0d8c7d;\n  --ui-color-secondary-700: #067a6e;\n  --ui-color-secondary-800: #073c34;\n  --ui-color-secondary-900: #052924;\n  --ui-color-secondary-950: #04201c;\n\n  /* success — EXACT Geist green (geist-colors), verbatim from main.css */\n  --ui-color-success-50: #effbef;\n  --ui-color-success-100: #ebfaeb;\n  --ui-color-success-200: #daf6da;\n  --ui-color-success-300: #c6f1c7;\n  --ui-color-success-400: #6cda75;\n  --ui-color-success-500: #45a557;\n  --ui-color-success-600: #398e4a;\n  --ui-color-success-700: #297a3a;\n  --ui-color-success-800: #1b311e;\n  --ui-color-success-900: #142416;\n  --ui-color-success-950: #0e1a10;\n\n  /* info — EXACT Geist blue (geist-colors, signature #0072f5), verbatim */\n  --ui-color-info-50: #f0f7ff;\n  --ui-color-info-100: #ebf5ff;\n  --ui-color-info-200: #e0f0ff;\n  --ui-color-info-300: #cce6ff;\n  --ui-color-info-400: #52aeff;\n  --ui-color-info-500: #0072f5;\n  --ui-color-info-600: #0062d1;\n  --ui-color-info-700: #0068d6;\n  --ui-color-info-800: #00254d;\n  --ui-color-info-900: #001b38;\n  --ui-color-info-950: #001429;\n\n  /* warning — custom amber scale (now upstream in geist-nuxt main.css too;\n     replaces Geist's amber, all other functional ramps remain exact Geist).\n     --ui-warning = 500 (light) / 400 (dark). */\n  --ui-color-warning-50: #FFF8E1;\n  --ui-color-warning-100: #FEF0C7;\n  --ui-color-warning-200: #FDE29A;\n  --ui-color-warning-300: #FBD16B;\n  --ui-color-warning-400: #F4B740;\n  --ui-color-warning-500: #E99B18;\n  --ui-color-warning-600: #C97807;\n  --ui-color-warning-700: #9D5705;\n  --ui-color-warning-800: #7B4207;\n  --ui-color-warning-900: #64350B;\n  --ui-color-warning-950: #3A1B03;\n\n  /* error — EXACT Geist red (geist-colors), verbatim from main.css */\n  --ui-color-error-50: #fff0f0;\n  --ui-color-error-100: #ffebeb;\n  --ui-color-error-200: #ffe5e5;\n  --ui-color-error-300: #fdd8d8;\n  --ui-color-error-400: #f87275;\n  --ui-color-error-500: #e5484d;\n  --ui-color-error-600: #da2f35;\n  --ui-color-error-700: #cb2a2f;\n  --ui-color-error-800: #391417;\n  --ui-color-error-900: #2a0e11;\n  --ui-color-error-950: #1e0a0c;\n\n  /* neutral — Tailwind neutral (nuxt/ui default kept by geist-nuxt). The\n     VISIBLE surface/text/border grays are the exact Geist scale, applied as\n     semantic overrides in semantic.css; this ramp backs `color=\"neutral\"`. */\n  --ui-color-neutral-50: #fafafa;\n  --ui-color-neutral-100: #f5f5f5;\n  --ui-color-neutral-200: #e5e5e5;\n  --ui-color-neutral-300: #d4d4d4;\n  --ui-color-neutral-400: #a3a3a3;\n  --ui-color-neutral-500: #737373;\n  --ui-color-neutral-600: #525252;\n  --ui-color-neutral-700: #404040;\n  --ui-color-neutral-800: #262626;\n  --ui-color-neutral-900: #171717;\n  --ui-color-neutral-950: #0a0a0a;\n}\n\n/*\n * Semantic layer — the public token contract components consume.\n * Source of truth: abel-2333-org/geist-nuxt (packages/core main.css + Geist --ds-gray) + nuxt/ui.\n *\n * Geist visual language: monochrome, high-contrast, small radius, calm\n * elevation. Nuxt UI derives every runtime token (--ui-text-*, --ui-bg-*,\n * --ui-border-*, --ui-primary …) from a neutral ramp, but Geist ships\n * independent light/dark values at each step — so we override the semantic\n * --ui-* tokens per mode directly (values = Geist's published --ds-gray).\n */\n\n/* ── Radius — Geist 3-tier, derived from a single --ui-radius (6px base) ──── */\n/* Nuxt UI scales xs .5× / sm 1× / md 1.5× / lg 2× / xl 3×. Base 6px lands the\n   control tier (sm = 6) and panel tier (lg = 12) on Geist exactly; the largest\n   tier is pinned to 16 (3× would be 18). Mapping: control/input/badge → sm;\n   card/panel → lg; modal/overlay → xl. */\n:root {\n  --ui-radius: 0.375rem;   /* 6px  — Geist material-base */\n  --radius-xs: 0.1875rem;  /* 3px  */\n  --radius-sm: 0.375rem;   /* 6px  — control / input / badge */\n  --radius-md: 0.5625rem;  /* 9px  */\n  --radius-lg: 0.75rem;    /* 12px — card / panel */\n  --radius-xl: 16px;       /* pinned (3× would be 18px) — modal / overlay */\n\n  --ui-container: 1200px;  /* Geist content column width */\n\n  /* Type scale addition — \"Copy 13 Mono\" (13px inline code). Upstream promotes\n     this to a semantic token (--text-code) so 13px inline code is a single\n     source of truth; InlineCode consumes it. */\n  --text-code: 0.8125rem;\n\n  /* Elevation — Geist subtle 3-tier. Cards/tooltips use --shadow-xs (per-mode,\n     below); popovers/menus use --shadow-lg; modals/dialogs use --shadow-xl.\n     Popover & modal shadows are identical in light and dark. */\n  --shadow-lg: 0 1px 1px rgba(0, 0, 0, 0.02), 0 4px 8px -4px rgba(0, 0, 0, 0.04), 0 16px 24px -8px rgba(0, 0, 0, 0.06);\n  --shadow-xl: 0 1px 1px rgba(0, 0, 0, 0.02), 0 8px 16px -4px rgba(0, 0, 0, 0.04), 0 24px 32px -8px rgba(0, 0, 0, 0.06);\n\n  /* Motion — Geist signature spring-like ease. Durations: 150ms state, 200ms\n     popover/tooltip, 300ms overlay. Honor prefers-reduced-motion (base.css). */\n  --ease-out: cubic-bezier(0.175, 0.885, 0.32, 1.1); /* @kind other */\n\n  /* Breakpoints — exact Geist values (informational; the runtime remaps\n     Tailwind's --breakpoint-* so every sm:/md:/lg: utility follows Geist). */\n  --breakpoint-sm: 401px;\n  --breakpoint-md: 601px;\n  --breakpoint-lg: 961px;\n  --breakpoint-xl: 1200px;\n  --breakpoint-2xl: 1400px;\n}\n\n/* ── Light theme runtime tokens — exact Geist LIGHT --ds-gray ─────────────── */\n:root,\n.light {\n  --ui-primary: var(--ui-color-primary-500);\n  --ui-secondary: var(--ui-color-secondary-500);\n  --ui-success: var(--ui-color-success-500);\n  --ui-info: var(--ui-color-info-500);\n  --ui-warning: var(--ui-color-warning-500);\n  --ui-error: var(--ui-color-error-500);\n\n  --ui-bg: #ffffff;              /* Geist Background 1 */\n  --ui-bg-muted: #fafafa;        /* Geist Background 2 */\n  --ui-bg-elevated: #f2f2f2;     /* Geist gray-100 */\n  --ui-bg-accented: #ebebeb;     /* Geist gray-200 */\n  --ui-bg-inverted: #171717;     /* Geist gray-1000 */\n\n  --ui-border-muted: #ebebeb;    /* Geist gray-200 */\n  --ui-border: #ebebeb;          /* default border */\n  --ui-border-accented: #c9c9c9; /* Geist gray-500 (hover border) */\n  --ui-border-inverted: #171717;\n\n  --ui-text-dimmed: #a8a8a8;     /* Geist gray-600 */\n  --ui-text-muted: #8f8f8f;      /* Geist gray-700 */\n  --ui-text-toned: #666666;      /* Geist gray-900 */\n  --ui-text: #171717;            /* Geist gray-1000 (primary text) */\n  --ui-text-highlighted: #171717;\n  --ui-text-inverted: #ffffff;\n\n  --shadow-xs: 0 2px 2px rgba(0, 0, 0, 0.04);\n}\n\n/* ── Dark theme runtime tokens — exact Geist DARK --ds-gray ───────────────── */\n.dark {\n  --ui-primary: var(--ui-color-primary-400);\n  --ui-secondary: var(--ui-color-secondary-400);\n  --ui-success: var(--ui-color-success-400);\n  --ui-info: var(--ui-color-info-400);\n  --ui-warning: var(--ui-color-warning-400);\n  --ui-error: var(--ui-color-error-400);\n\n  --ui-bg: #0a0a0a;              /* Geist dark Background 1 */\n  --ui-bg-muted: #1a1a1a;        /* Geist dark gray-100 */\n  --ui-bg-elevated: #1f1f1f;     /* Geist dark gray-200 */\n  --ui-bg-accented: #292929;     /* Geist dark gray-300 */\n  --ui-bg-inverted: #ffffff;\n\n  --ui-border-muted: #1f1f1f;    /* Geist dark gray-200 */\n  --ui-border: #2e2e2e;          /* Geist dark gray-400 (default border) */\n  --ui-border-accented: #454545; /* Geist dark gray-500 (hover border) */\n  --ui-border-inverted: #ffffff;\n\n  --ui-text-dimmed: #878787;     /* Geist dark gray-600 */\n  --ui-text-muted: #8f8f8f;      /* Geist dark gray-700 */\n  --ui-text-toned: #a1a1a1;      /* Geist dark gray-900 */\n  --ui-text: #ededed;            /* Geist dark gray-1000 (primary text) */\n  --ui-text-highlighted: #ffffff;\n  --ui-text-inverted: #0a0a0a;\n\n  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.16);\n}\n\n/*\n * Global baseline — mirrors abel-2333-org/geist-nuxt (Geist main.css baseline).\n * Only global resets, color-scheme, and reduced-motion live here; all component\n * styling stays inline / on the --ui-* tokens.\n */\n:root {\n  color-scheme: light;\n}\n\n.dark {\n  color-scheme: dark;\n}\n\nhtml,\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  background-color: var(--ui-bg);\n  color: var(--ui-text);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nbutton:not(:disabled),\n[role=\"button\"]:not(:disabled) {\n  cursor: pointer;\n}\n\n/*\n * Accessibility — honor prefers-reduced-motion (Geist drops nonessential\n * motion). Collapses animation/transition to near-instant without removing\n * focus/state feedback.\n */\n@media (prefers-reduced-motion: reduce) {\n  *,\n  *::before,\n  *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n    scroll-behavior: auto !important;\n  }\n}\n\n<\u002Fstyle>\n<script src=\"9e445010-5be1-44a8-a719-80c5452ab865\"><\u002Fscript>\n<script src=\"25991df3-f743-4c27-af82-afa4c2f4b914\"><\u002Fscript>\n<style>\nbody{margin:0;background:#e8e8e6;font-family:var(--font-sans),system-ui,sans-serif;\n--h-canvas:#FAFAFA;--h-surface:#ffffff;--h-line:#ebebeb;--h-line-2:#d4d4d4;--h-tint:#F7F7F7;\n--h-ink:#171717;--h-ink-2:#666666;--h-ink-3:#8f8f8f;--h-ink-4:#a8a8a8;\n--h-accent:#A8324A;--h-accent-hover:#8E2A3E;--h-r-ctl:6px;--h-r-card:12px;\n--h-ok:#45a557;--h-err:#e5484d;--h-warn:#E99B18}\na{color:var(--h-ink)}\na:hover{color:var(--h-accent)}\n@keyframes h-spin{to{transform:rotate(360deg)}}\n@keyframes h-shim{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height { payFoot }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isResult }}\">\n<header style=\"height:52px;flex:none;background:var(--h-surface);border-bottom:1px solid var(--h-line);padding:0 18px;display:flex;align-items:center;justify-content:space-between\">\n<span style=\"font-size:14px;font-weight:600;letter-spacing:.16em\">HALDEN<\u002Fspan>\n<span style=\"font-size:12px;color:var(--h-ink-3)\">Order status<\u002Fspan>\n<\u002Fheader>\n<div style=\"flex:1;overflow:auto;padding:26px 18px 30px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"flex:none;background:var(--h-surface);border:1px solid var(--h-line);border-radius:var(--h-r-card);padding:22px 20px\">\n<div role=\"status\" aria-live=\"polite\" style=\"display:flex;flex-direction:column;gap:12px\">\n<span style=\"width:40px;height:40px;border-radius:50%;background:{{ resBg }};display:flex;align-items:center;justify-content:center\">\n<iconify-icon icon=\"{{ resIcon }}\" width=\"20\" height=\"20\" style=\"color:{{ resFg }}\"><\u002Ficonify-icon>\n<\u002Fspan>\n<h1 style=\"margin:0;font-size:21px;font-weight:600;letter-spacing:-.02em\">{{ resTitle }}<\u002Fh1>\n<p style=\"margin:0;font-size:13.5px;line-height:1.55;color:var(--h-ink-2);text-wrap:pretty\">{{ resBody }}<\u002Fp>\n<\u002Fdiv>\n<div style=\"margin-top:20px;padding-top:18px;border-top:1px solid var(--h-line);display:flex;flex-direction:column;gap:11px\">\n<sc-for list=\"{{ resRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;font-size:13px\">\n<span style=\"color:var(--h-ink-2);white-space:nowrap\">{{ r.label }}<\u002Fspan>\n<span style=\"font:400 12px ui-monospace,Menlo,monospace;text-align:right;white-space:nowrap\">{{ r.value }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:22px;display:flex;flex-direction:column;gap:10px\">\n<sc-if value=\"{{ canRetry }}\">\n<button type=\"button\" sc-camel n<sc-for list=\"{{ tech }}\" as=\"t\" hint-placeholder-count=\"6\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px\">\n<span style=\"font:400 11.5px ui-monospace,Menlo,monospace;color:var(--h-ink-3);white-space:nowrap\">{{ t.label }}<\u002Fspan>\n<span style=\"font:400 11.5px ui-monospace,Menlo,monospace;text-align:right;white-space:nowrap\">{{ t.value }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<p style=\"margin:8px 0 0;font-size:11.5px;line-height:1.5;color:var(--h-ink-4)\">Demo values only. Card numbers, CVC and API credentials are never shown here.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<span style=\"font-size:11.5px;color:#8f8f8f;text-align:center\">Payments by Onerway<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<div style=\"max-width:1180px;background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:12px;padding:26px 30px;display:flex;gap:44px;align-items:flex-start\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n<h2 style=\"margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em\">State flow<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:9px;font-size:12.5px;line-height:1.55;color:var(--h-ink-2)\">\n<span><strong style=\"color:var(--h-ink)\">Hub → Checkout.<\u002Fstrong> Start demo mounts the SDK: <em>SDK loading<\u002Fem> (Pay disabled) → <em>SDK ready<\u002Fem> after mount resolves.<\u002Fspan>\n<span><strong style=\"color:var(--h-ink)\">$5.00 path.<\u002Fstrong> Pay → <em>Submitting<\u002Fem> → <em>Succeeded<\u002Fem> result.<\u002Fspan>\n<span><strong style=\"color:var(--h-ink)\">$50.00 path.<\u002Fstrong> Pay → <em>Submitting<\u002Fem> → <em>Redirecting to 3DS<\u002Fem> → <em>Returned, verifying<\u002Fem> → <em>Succeeded<\u002Fem> result.<\u002Fspan>\n<span><strong style=\"color:var(--h-ink)\">Declined.<\u002Fstrong> Failure returns to checkout with an inline SDK error, or lands on the failed result page — both keep Retry.<\u002Fspan>\n<span><strong style=\"color:var(--h-ink)\">Not completed.<\u002Fstrong> Returning from the bank without confirming restores the ready form with a neutral notice; nothing is charged.<\u002Fspan>\n<span><strong style=\"color:var(--h-ink)\">Processing.<\u002Fstrong> An unresolved authorisation shows the processing result; Retry is hidden so the shopper can't double-charge.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:1px;align-self:stretch;background:rgba(0,0,0,.08)\"><\u002Fdiv>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n<h2 style=\"margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em\">SDK region vs merchant region<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:9px;font-size:12.5px;line-height:1.55;color:var(--h-ink-2)\">\n<span><strong style=\"color:var(--h-ink)\">Onerway SDK owns<\u002Fstrong> everything inside the dashed Payment Element: wallet buttons (rendered by Apple / Google, never redrawn), hosted card fields, field-level validation, and the 3DS handoff. Its four states — loading, ready, error, unavailable — are shown by the container chrome, not by merchant markup.<\u002Fspan>\n<span><strong style=\"color:var(--h-ink)\">Halden owns<\u002Fstrong> the page shell, order summary, delivery block, status banners, the Pay button and its busy/disabled states, the result pages and Technical details.<\u002Fspan>\n<span><strong style=\"color:var(--h-ink)\">Handoff contract.<\u002Fstrong> Merchant calls confirm on Pay; SDK reports ready / requires-action / succeeded / failed / canceled; merchant renders the banner and result page from that. Amounts render from one source, so summary and button always match.<\u002Fspan>\n<span style=\"color:var(--h-ink-4)\">Placeholder card text inside the SDK region stands in for Onerway-hosted inputs; final styling is limited to the SDK's supported appearance options.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1180px;background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:12px;padding:26px 30px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"display:flex;align-items:baseline;gap:12px\">\n<h2 style=\"margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em\">Breakpoint rules for implementation<\u002Fh2>\n<span style=\"font-size:12px;color:var(--h-ink-3)\">Three frames are drawn (1440 / 834 / 390); these rules cover every width in between, using the Geist breakpoints.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:150px 1fr 1fr;gap:0;border:1px solid rgba(0,0,0,.08);border-radius:8px;overflow:hidden;font-size:12.5px\">\n<div style=\"padding:10px 14px;background:var(--h-tint);font-weight:600;border-bottom:1px solid rgba(0,0,0,.08)\">Width<\u002Fdiv>\n<div style=\"padding:10px 14px;background:var(--h-tint);font-weight:600;border-bottom:1px solid rgba(0,0,0,.08)\">Layout<\u002Fdiv>\n<div style=\"padding:10px 14px;background:var(--h-tint);font-weight:600;border-bottom:1px solid rgba(0,0,0,.08)\">Pay button &amp; summary<\u002Fdiv>\n\n<div style=\"padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.06);font:400 12px ui-monospace,Menlo,monospace\">≥ 1200<\u002Fdiv>\n<div style=\"padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.06);color:var(--h-ink-2)\">Two columns, 1120 container centered; extra width becomes margin (drawn at 1440).<\u002Fdiv>\n<div style=\"padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.06);color:var(--h-ink-2)\">Summary column is sticky and owns the Pay button.<\u002Fdiv>\n\n<div style=\"padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.06);font:400 12px ui-monospace,Menlo,monospace\">961 – 1199<\u002Fdiv>\n<div style=\"padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.06);color:var(--h-ink-2)\">Same two columns, container shrinks to 100% − 48px; payment panel flexes, summary column holds 380 min.<\u002Fdiv>\n<div style=\"padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.06);color:var(--h-ink-2)\">Unchanged.<\u002Fdiv>\n\n<div style=\"padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.06);font:400 12px ui-monospace,Menlo,monospace\">601 – 960<\u002Fdiv>\n<div style=\"padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.06);color:var(--h-ink-2)\">One column, 640 content max, centered (drawn at 834). Summary collapses into a top bar.<\u002Fdiv>\n<div style=\"padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.06);color:var(--h-ink-2)\">Pay moves into a persistent bottom bar with the total beside it.<\u002Fdiv>\n\n<div style=\"padding:11px 14px;font:400 12px ui-monospace,Menlo,monospace\">≤ 600<\u002Fdiv>\n<div style=\"padding:11px 14px;color:var(--h-ink-2)\">One column, full-bleed cards, 18px gutters (drawn at 390; holds down to 320).<\u002Fdiv>\n<div style=\"padding:11px 14px;color:var(--h-ink-2)\">Bottom bar stacks total above a full-width Pay button; wallet buttons stack.<\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-size:12px;line-height:1.55;color:var(--h-ink-3)\">Invariants at every width: the SDK Payment Element keeps its own boundary and never sits in a horizontally scrolling area; summary total and Pay label read from one amount source; the Pay button stays visible through submitting / redirecting / verifying; touch targets stay ≥ 44px below 961.<\u002Fspan>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1200},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#A8324A&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#A8324A&quot;,&quot;#171717&quot;,&quot;#7A3CE2&quot;,&quot;#0060D1&quot;],&quot;section&quot;:&quot;Merchant theme&quot;},&quot;accentHover&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8E2A3E&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#8E2A3E&quot;,&quot;#000000&quot;,&quot;#6A2BC4&quot;,&quot;#004FAD&quot;],&quot;section&quot;:&quot;Merchant theme&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: 'hub', cs: 'loading', flow: 'normal', res: 'success', dev: 'both', tech: false, sum: false };\n  timers = [];\n\n  componentDidMount() { this.applyTheme(); }\n  componentDidUpdate() { this.applyTheme(); }\n  componentWillUnmount() { this.clear(); }\n\n  applyTheme() {\n    const b = document.body.style;\n    b.setProperty('--h-accent', this.props.accent || '#A8324A');\n    b.setProperty('--h-accent-hover', this.props.accentHover || '#8E2A3E');\n  }\n  clear() { this.timers.forEach(clearTimeout); this.timers = []; }\n  tick(ms, fn) { this.timers.push(setTimeout(fn, ms)); }\n  jumpTo(o) { this.clear(); this.setState(o); }\n\n  startDemo() {\n    this.clear();\n    this.setState({ page: 'checkout', cs: 'loading', sum: false });\n    this.tick(1200, () => this.setState({ cs: 'ready' }));\n  }\n  pay() {\n    this.clear();\n    this.setState({ cs: 'submitting' });\n    if (this.state.flow === '3ds') {\n      this.tick(1100, () => {\n        this.setState({ cs: 'redirecting' });\n        this.tick(1500, () => {\n          this.setState({ cs: 'verifying' });\n          this.tick(1700, () => this.setState({ page: 'result', res: 'success', tech: false }));\n        });\n      });\n    } else {\n      this.tick(1500, () => this.setState({ page: 'result', res: 'success', tech: false }));\n    }\n  }\n  retry() {\n    this.clear();\n    this.setState({ page: 'checkout', cs: 'loading', tech: false });\n    this.tick(900, () => this.setState({ cs: 'ready' }));\n  }\n  backToHub(e) {\n    if (e && e.preventDefault) e.preventDefault();\n    this.clear();\n    this.setState({ page: 'hub', cs: 'loading', tech: false, sum: false });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const three = s.flow === '3ds';\n    const cs = s.cs;\n    const money = three\n      ? { variant: 'Full size · 30 ml', unit: '$45.50', sub: '$45.50', duty: '$4.50', total: '$50.00', raw: '50.00' }\n      : { variant: 'Travel size · 5 ml', unit: '$4.50', sub: '$4.50', duty: '$0.50', total: '$5.00', raw: '5.00' };\n\n    const busy = { submitting: 1, redirecting: 1, verifying: 1 }[cs] === 1;\n    const busyCopy = {\n      submitting: ['Processing payment…', 'Sending your payment to Onerway. Do not close this window.'],\n      redirecting: ['Redirecting to your bank…', 'Your bank will ask you to confirm this payment, then send you back here.'],\n      verifying: ['Confirming your payment…', 'You are back from your bank. We are checking the verification result.']\n    }[cs] || ['Processing payment…', ''];\n\n    const banners = {\n      redirecting: ['#FDF6E8', 'rgba(233,155,24,.28)', '#B87503', 'lucide:external-link', 'Taking you to your bank', 'Keep this window open. We will bring you back automatically.'],\n      verifying: ['#F0F6FE', 'rgba(0,114,245,.24)', '#0060D1', 'lucide:loader', 'Verification complete — confirming result', 'This usually takes a few seconds. Do not refresh the page.'],\n      error: ['#FEF1F1', 'rgba(229,72,77,.26)', '#C62A2F', 'lucide:alert-circle', 'Payment declined by your bank', 'Nothing was charged. Try a different card, or use a wallet instead.'],\n      canceled: ['#F7F7F7', '#e5e5e5', '#525252', 'lucide:info', 'Payment not completed', 'You came back from your bank without confirming. Your order is still here — nothing was charged.']\n    };\n    const b = banners[cs];\n\n    const chip = {\n      loading: ['#F0F0F0', '#8f8f8f', 'Loading'],\n      ready: ['#EAF6EC', '#3D8B4C', 'Ready'],\n      submitting: ['#F0F6FE', '#0060D1', 'Processing'],\n      redirecting: ['#F0F6FE', '#0060D1', 'Processing'],\n      verifying: ['#F0F6FE', '#0060D1', 'Processing'],\n      error: ['#FEF1F1', '#C62A2F', 'Error'],\n      canceled: ['#EAF6EC', '#3D8B4C', 'Ready'],\n      walletsoff: ['#EAF6EC', '#3D8B4C', 'Ready']\n    }[cs] || ['#F0F0F0', '#8f8f8f', 'Loading'];\n\n    const resMap = {\n      success: {\n        title: 'Payment successful', icon: 'lucide:check', fg: '#3D8B4C', bg: '#EAF6EC',\n        body: 'Thanks, Emma. Your order is confirmed and will ship from Copenhagen within two business days.', retry: false\n      },\n      failed: {\n        title: 'Payment failed', icon: 'lucide:x', fg: '#C62A2F', bg: '#FEF1F1',\n        body: 'Your bank declined this payment and nothing was charged. You can try again with a different card or a wallet.', retry: true\n      },\n      processing: {\n        title: 'Payment is processing', icon: 'lucide:clock', fg: '#B87503', bg: '#FDF6E8',\n        body: 'Your bank has not confirmed the result yet. We will email you as soon as it settles — do not pay again.', retry: false\n      },\n      canceled: {\n        title: 'Payment not completed', icon: 'lucide:circle-slash', fg: '#525252', bg: '#F2F2F2',\n        body: 'You left the bank verification before confirming, so the payment was not completed. Nothing was charged.', retry: true\n      }\n    }[s.res];\n\n    const method = three ? 'Visa •••• 4242 · 3DS challenge' : 'Visa •••• 4242';\n    const orderId = three ? 'HLD-2607-4821' : 'HLD-2607-4735';\n    const codes = { success: ['00', 'Approved'], failed: ['05', 'Do not honour'], processing: ['09', 'Authorisation pending'], canceled: ['3D1', 'Challenge abandoned'] }[s.res];\n\n    const cur = s.page === 'hub' ? 'hub' : s.page === 'checkout' ? cs : 'r_' + s.res;\n    const keys = ['hub', 'loading', 'ready', 'submitting', 'redirecting', 'verifying', 'error', 'canceled', 'walletsoff', 'r_success', 'r_failed', 'r_processing', 'r_canceled'];\n    const ab = {}, af = {};\n    keys.forEach(k => { ab[k] = k === cur ? '#FAFAFA' : 'rgba(255,255,255,.08)'; af[k] = k === cur ? '#171717' : '#c4c4c4'; });\n\n    const chipBg = on => on ? '#FAFAFA' : 'rgba(255,255,255,.08)';\n    const chipFg = on => on ? '#171717' : '#c4c4c4';\n    const co = (k, v) => ({ ...k, ...v });\n\n    return {\n      isHub: s.page === 'hub', isCheckout: s.page === 'checkout', isResult: s.page === 'result',\n      showDesktop: s.dev === 'both' || s.dev === 'desktop',\n      showTablet: s.dev === 'both' || s.dev === 'tablet',\n      showMobile: s.dev === 'both' || s.dev === 'mobile',\n      variant: money.variant, unit: money.unit, total: money.total,\n      lines: [\n        { label: 'Subtotal', value: money.sub },\n        { label: 'International shipping', value: 'Free' },\n        { label: 'Duties and taxes', value: money.duty }\n      ],\n      envRows: [\n        { label: 'Environment', value: 'sandbox' },\n        { label: 'Scenario', value: 'e-commerce' },\n        { label: 'Integration', value: 'web-js-sdk' },\n        { label: 'Country', value: 'US' },\n        { label: 'Currency', value: 'USD' }\n      ],\n      methods: [\n        { icon: 'lucide:credit-card', name: 'Card — Visa, Mastercard, Amex', note: 'Available' },\n        { icon: 'lucide:apple', name: 'Apple Pay', note: 'Supported browsers' },\n        { icon: 'lucide:smartphone', name: 'Google Pay', note: 'Supported browsers' }\n      ],\n\n      rLoading: cs === 'loading',\n      rBusy: busy,\n      rForm: !busy && cs !== 'loading',\n      rError: cs === 'error',\n      walletsOn: cs !== 'walletsoff',\n      walletsOff: cs === 'walletsoff',\n      fieldBd: cs === 'error' ? 'rgba(229,72,77,.5)' : '#e5e5e5',\n      sdkChipBg: chip[0], sdkChipFg: chip[1], sdkChipLabel: chip[2],\n      busyTitle: busyCopy[0], busyBody: busyCopy[1],\n      hasBanner: !!b,\n      bannerBg: b ? b[0] : '#fff', bannerBd: b ? b[1] : '#fff', bannerFg: b ? b[2] : '#171717',\n      bannerIcon: b ? b[3] : 'lucide:info', bannerTitle: b ? b[4] : '', bannerBody: b ? b[5] : '',\n\n      payReady: !busy && cs !== 'loading',\n      payBusy: busy,\n      payLocked: cs === 'loading',\n      payFoot: busy ? 'Keep this window open until we finish' : 'Secure payment · Halden does not store your card details',\n\n      resTitle: resMap.title, resBody: resMap.body, resIcon: resMap.icon, resFg: resMap.fg, resBg: resMap.bg,\n      canRetry: resMap.retry,\n      hasResNote: s.res === 'success' || s.res === 'processing',\n      resNote: s.res === 'success' ? 'A confirmation email is on its way to emma@example.com'\n        : s.res === 'processing' ? 'We’ll email emma@example.com as soon as the result is confirmed' : '',\n      resRows: [\n        { label: 'Order', value: orderId },\n        { label: 'Amount', value: money.total + ' USD' },\n        { label: 'Payment method', value: method },\n        { label: 'Date', value: '28 Jul 2026, 14:32 UTC' }\n      ],\n      tech: [\n        { label: 'environment', value: 'sandbox' },\n        { label: 'integration', value: 'web-js-sdk' },\n        { label: 'txnType', value: 'SALE' },\n        { label: 'merchantTxnId', value: orderId },\n        { label: 'onerwayTxnId', value: 'ow_txn_3Kd92Xb1SbX' },\n        { label: 'amount / currency', value: money.raw + ' USD' },\n        { label: 'country', value: 'US' },\n        { label: 'threeDS', value: three ? 'challenge (v2.2)' : 'frictionless' },\n        { label: 'respCode', value: codes[0] },\n        { label: 'respMsg', value: codes[1] }\n      ],\n      techOpen: s.tech, techClosed: !s.tech,\n      sumOpen: s.sum, sumClosed: !s.sum,\n\n      pickBg: { normal: three ? '#fff' : 'rgba(122,60,226,.05)', threeds: three ? 'rgba(122,60,226,.05)' : '#fff' },\n      pickBd: { normal: three ? '#e5e5e5' : 'var(--ui-primary)', threeds: three ? 'var(--ui-primary)' : '#e5e5e5' },\n      pickDot: { normal: three ? '#d4d4d4' : 'var(--ui-primary)', threeds: three ? 'var(--ui-primary)' : '#d4d4d4' },\n      pickFill: { normal: three ? '#fff' : 'var(--ui-primary)', threeds: three ? 'var(--ui-primary)' : '#fff' },\n      pickRing: { normal: three ? 'none' : 'inset 0 0 0 3px #fff', threeds: three ? 'inset 0 0 0 3px #fff' : 'none' },\n\n      db: { both: chipBg(s.dev === 'both'), desktop: chipBg(s.dev === 'desktop'), tablet: chipBg(s.dev === 'tablet'), mobile: chipBg(s.dev === 'mobile') },\n      df: { both: chipFg(s.dev === 'both'), desktop: chipFg(s.dev === 'desktop'), tablet: chipFg(s.dev === 'tablet'), mobile: chipFg(s.dev === 'mobile') },\n      fb: { normal: chipBg(!three), threeds: chipBg(three) },\n      ff: { normal: chipFg(!three), threeds: chipFg(three) },\n      ab: ab, af: af,\n\n      dev: {\n        both: () => this.setState({ dev: 'both' }),\n        desktop: () => this.setState({ dev: 'desktop' }),\n        tablet: () => this.setState({ dev: 'tablet' }),\n        mobile: () => this.setState({ dev: 'mobile' })\n      },\n      flowSet: {\n        normal: () => this.setState({ flow: 'normal' }),\n        threeds: () => this.setState({ flow: '3ds' })\n      },\n      jump: {\n        hub: () => this.jumpTo({ page: 'hub' }),\n        loading: () => this.jumpTo({ page: 'checkout', cs: 'loading' }),\n        ready: () => this.jumpTo({ page: 'checkout', cs: 'ready' }),\n        submitting: () => this.jumpTo({ page: 'checkout', cs: 'submitting' }),\n        redirecting: () => this.jumpTo({ page: 'checkout', cs: 'redirecting' }),\n        verifying: () => this.jumpTo({ page: 'checkout', cs: 'verifying' }),\n        error: () => this.jumpTo({ page: 'checkout', cs: 'error' }),\n        canceled: () => this.jumpTo({ page: 'checkout', cs: 'canceled' }),\n        walletsoff: () => this.jumpTo({ page: 'checkout', cs: 'walletsoff' }),\n        rsuccess: () => this.jumpTo({ page: 'result', res: 'success' }),\n        rfailed: () => this.jumpTo({ page: 'result', res: 'failed' }),\n        rprocessing: () => this.jumpTo({ page: 'result', res: 'processing' }),\n        rcanceled: () => this.jumpTo({ page: 'result', res: 'canceled' })\n      },\n      startDemo: () => this.startDemo(),\n      pay: () => this.pay(),\n      retry: () => this.retry(),\n      backToHub: e => this.backToHub(e),\n      toggleTech: () => this.setState(p => ({ tech: !p.tech })),\n      toggleSummary: () => this.setState(p => ({ sum: !p.sum }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002F
